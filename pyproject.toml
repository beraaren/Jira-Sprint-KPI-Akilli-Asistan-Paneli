[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-analyzer-mcp"
version = "0.1.0"
description = "Jira Sprint ve KPI Analiz Asistanı"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "lxml>=5.2.0",
    "openpyxl>=3.1.0",
    "mcp>=1.0.0,<2",
    "streamlit>=1.30.0",
    "plotly>=5.0.0",
    "ollama>=0.6.0",
    "requests>=2.28.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]